name: Build LabelWorks

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            platform: win
          - os: macos-latest
            script: dist:mac
            platform: mac
          - os: ubuntu-latest
            script: dist:linux
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }} installer
        shell: bash
        run: |
          set +e
          npm run ${{ matrix.script }} 2>&1 | tee build-output.log
          EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$EXIT"
          if [ "$EXIT" -ne 0 ]; then
            echo "### Build failed on ${{ matrix.platform }} (exit $EXIT)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 build-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Build error output (${{ matrix.platform }})"
            tail -40 build-output.log
            echo "::endgroup::"
            while IFS= read -r line; do
              case "$line" in
                *⨯*|*Error:*|*"error "*|*ERR_*|*"failed"*)
                  echo "::error::${line}"
                  ;;
              esac
            done < <(tail -60 build-output.log | tr -d '\r')
          fi
          exit "$EXIT"

      - name: Upload build log (always, for diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build-output.log
          if-no-files-found: warn

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LabelWorks-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
